name: Deploy download page

# 把 download-page/ 推到 gh-pages 分支（内容部署，已验证稳定）
# 注意：GitHub 禁止 GITHUB_TOKEN 通过 API 自动启用 Pages（返回 403 Resource not accessible by integration），
#       因此首次开启 Pages 开关仍需人工在 Settings → Pages 点一次；开启后本工作流自动更新内容。
# 地址：https://neekin.github.io/seaply-client/
on:
  push:
    branches: [main]
    paths:
      - 'download-page/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy content to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./download-page
          publish_branch: gh-pages
