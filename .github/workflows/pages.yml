name: Deploy download page

# 方案：
# 1) peaceiris 把 download-page/ 推到 gh-pages 分支（内容部署，已验证稳定）
# 2) 用 GITHUB_TOKEN 调用 Pages enable API 自动开启 Pages
#    - 若 GitHub 允许，开关直接打开，下载页立即生效
#    - 若被拒，把 GitHub 返回的真实错误回写到公开文件 ci-pages-enable.log 便于诊断
# 地址：https://neekin.github.io/seaply-client/
on:
  push:
    branches: [main]
    paths:
      - 'download-page/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy content to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./download-page
          publish_branch: gh-pages

      - name: Enable Pages (auto) + capture error
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "== try enable Pages via API =="
          RESP=$(curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}' \
            "https://api.github.com/repos/neekin/seaply-client/pages")
          echo "$RESP"
          echo "$RESP" > /tmp/enable.json
          CONTENT=$(base64 -w0 /tmp/enable.json)
          curl -sS -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"message\":\"pages enable diag\",\"content\":\"$CONTENT\"}" \
            "https://api.github.com/repos/neekin/seaply-client/contents/ci-pages-enable.log" || true
