name: Deploy download page

# 官方 GitHub Pages 部署方式：
# - actions/configure-pages 在首次运行时自动 enable 仓库的 Pages（无需手动去 Settings 开）
# - upload-pages-artifact + deploy-pages 把 download-page/ 部署为站点
# 地址：https://neekin.github.io/seaply-client/
on:
  push:
    branches: [main]
    paths:
      - 'download-page/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Pages 部署必需的两个权限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./download-page

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
