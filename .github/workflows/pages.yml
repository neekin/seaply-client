name: Deploy download page

# 把 download-page/ 推到 gh-pages 分支（地址 https://neekin.github.io/seaply-client/）
# 首次需到仓库 Settings → Pages → Source 选 “Deploy from a branch” → gh-pages / root
on:
  push:
    branches: [main]
    paths:
      - 'download-page/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./download-page
          publish_branch: gh-pages
