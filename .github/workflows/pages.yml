name: Deploy download page

# 把 download-page/ 部署到 GitHub Pages（gh-pages），
# 地址：https://neekin.github.io/seaply-client/
on:
  push:
    branches: [main]
    paths:
      - 'download-page/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'download-page'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
