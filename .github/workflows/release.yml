name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS rust targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Seaply Desk ${{ github.ref_name }}'
          releaseBody: '自动构建的桌面客户端安装包（macOS / Windows）'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Windows 便携版：把可直接运行的 exe（前端资源已嵌入二进制）连同 WebView2Loader.dll 打进 zip，免安装
      - name: Create portable zip (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $out = "Seaply.Desk_${ver}_x64_portable.zip"
          $exe = "src-tauri/target/release/seaply-client.exe"
          if (-not (Test-Path $exe)) { throw "未找到可执行文件: $exe" }
          $items = @($exe)
          $dll = "src-tauri/target/release/WebView2Loader.dll"
          if (Test-Path $dll) { $items += $dll }
          Compress-Archive -Path $items -DestinationPath $out -Force
          "已生成: $out"
          Get-Item $out | Select-Object Name, Length | Format-List

      - name: Upload portable zip to release
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          gh release upload "${{ github.ref_name }}" "Seaply.Desk_${ver}_x64_portable.zip" --clobber
