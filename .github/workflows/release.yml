name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS rust targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Seaply Desk ${{ github.ref_name }}'
          releaseBody: '自动构建的桌面客户端安装包（macOS / Windows）'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # 构建失败时，把错误日志写回仓库（公开仓库文件匿名可读），便于本地排查
      - name: Upload build log on failure
        if: failure()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "re-running build to capture log..."
          npx tauri build ${{ matrix.args }} > /tmp/build.log 2>&1 || true
          echo "---- last 200 lines ----"
          tail -n 200 /tmp/build.log
          CONTENT=$(base64 -w0 /tmp/build.log)
          curl -s -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"message\":\"ci diag ${{ matrix.platform }}\",\"content\":\"$CONTENT\"}" \
            "https://api.github.com/repos/neekin/seaply-client/contents/ci-diag/${{ matrix.platform }}.log" || true
