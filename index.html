<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seaply 客服工作台 · 下载</title>
  <style>
    :root {
      --brand: #1677ff;
      --brand-dark: #0958d9;
      --ink: #1f2329;
      --muted: #6b7280;
      --bg: #f5f8ff;
      --card: #ffffff;
      --line: #e8edf5;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(160deg, #eef4ff 0%, #f5f8ff 45%, #ffffff 100%);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 880px; margin: 0 auto; padding: 64px 20px 48px; }
    .hero { text-align: center; margin-bottom: 44px; }
    .logo {
      width: 64px; height: 64px; border-radius: 16px;
      background: linear-gradient(135deg, var(--brand), #4f9bff);
      display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 24px rgba(22,119,255,.28); margin-bottom: 18px;
    }
    .logo svg { width: 34px; height: 34px; fill: #fff; }
    h1 { font-size: 30px; margin: 0 0 10px; letter-spacing: -.3px; }
    .sub { color: var(--muted); font-size: 15px; line-height: 1.7; margin: 0 auto; max-width: 520px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 26px 24px; display: flex; flex-direction: column; gap: 14px;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .card.recommend { border-color: var(--brand); box-shadow: 0 12px 30px rgba(22,119,255,.14); }
    .card-top { display: flex; align-items: center; gap: 12px; }
    .os-ico {
      width: 42px; height: 42px; border-radius: 10px; flex: none;
      background: #f0f5ff; display: flex; align-items: center; justify-content: center;
    }
    .os-ico svg { width: 24px; height: 24px; }
    .os-name { font-size: 17px; font-weight: 600; }
    .os-tag {
      font-size: 11px; color: var(--brand); background: #e8f1ff;
      border-radius: 6px; padding: 2px 8px; margin-left: 8px; font-weight: 600;
    }
    .meta { font-size: 13px; color: var(--muted); min-height: 18px; }
    .btn {
      margin-top: auto; text-align: center; text-decoration: none;
      background: var(--brand); color: #fff; font-weight: 600; font-size: 15px;
      padding: 12px 16px; border-radius: 10px; transition: background .15s ease;
    }
    .btn:hover { background: var(--brand-dark); }
    .btn.disabled { background: #c9d4e6; pointer-events: none; }
    .note { margin-top: 34px; font-size: 13px; color: var(--muted); line-height: 1.8; }
    .note code { background: #eef2f8; padding: 1px 6px; border-radius: 5px; }
    .all { text-align: center; margin-top: 22px; }
    .all a { color: var(--brand); font-size: 14px; text-decoration: none; }
    .all a:hover { text-decoration: underline; }
    .skel { color: var(--muted); font-size: 14px; }
    .err { color: #d4380d; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="logo">
        <svg viewBox="0 0 24 24"><path d="M12 3C6.48 3 2 6.94 2 11.5c0 2.6 1.5 4.92 3.83 6.45L5 21l3.6-1.86c.97.27 2 .43 3.21.43 5.52 0 10-3.94 10-8.44S17.52 3 12 3Z"/></svg>
      </div>
      <h1>Seaply 客服工作台</h1>
      <p class="sub">面向跨境电商卖家的桌面客服客户端。支持 macOS 与 Windows，登录即用，消息、媒体、话术库一站搞定。</p>
    </div>

    <div class="grid">
      <div class="card" id="card-mac">
        <div class="card-top">
          <div class="os-ico">
            <svg viewBox="0 0 24 24" fill="#1677ff"><path d="M16.5 1.5c.1 1-.3 2-.9 2.7-.7.8-1.7 1.4-2.7 1.3-.1-1 .4-2 .9-2.6.7-.8 1.8-1.4 2.7-1.4ZM20 17.3c-.5 1.2-.8 1.7-1.4 2.7-.9 1.4-2.2 3.1-3.8 3.3-1.3.2-1.8-.8-3.6-.8-1.8 0-2.2.9-3.6.9-1.6.1-2.8-1.6-3.7-3C2 17.7.9 12.7 2.7 9.4c1-1.7 2.7-2.7 4.4-2.7 1.6 0 2.6 1 3.9 1 1.3 0 2.1-1 3.9-1 1.4 0 2.9.8 4 2.1-3.5 1.9-2.9 6.9.1 8.5Z"/></svg>
          </div>
          <div class="os-name">macOS<span class="os-tag" id="tag-mac" style="display:none">推荐</span></div>
        </div>
        <div class="meta" id="meta-mac"><span class="skel">加载中…</span></div>
        <a class="btn disabled" id="btn-mac" href="#">下载 .dmg</a>
      </div>

      <div class="card" id="card-win">
        <div class="card-top">
          <div class="os-ico">
            <svg viewBox="0 0 24 24" fill="#1677ff"><path d="M3 5.3 10.3 4.2v8.1H3V5.3Zm0 13.4 7.3 1V10.4H3v8.3Zm8.4-13.6L21 3v9.3h-9.6V5.1ZM21 10.7v9.1l-9.6 1.4V10.7H21Z"/></svg>
          </div>
          <div class="os-name">Windows<span class="os-tag" id="tag-win" style="display:none">推荐</span></div>
        </div>
        <div class="meta" id="meta-win"><span class="skel">加载中…</span></div>
        <a class="btn disabled" id="btn-win" href="#">下载 .exe</a>
      </div>
    </div>

    <div class="all">
      <a id="all-link" href="https://github.com/neekin/seaply-client/releases" target="_blank" rel="noopener">查看所有版本 →</a>
    </div>

    <div class="note">
      <p><strong>未签名提示：</strong>当前安装包未做代码签名。</p>
      <ul style="margin:6px 0 0; padding-left:18px;">
        <li>macOS：首次打开若提示"无法验证开发者"，请到 <code>系统设置 → 隐私与安全性</code> 点击「仍要打开」。</li>
        <li>Windows：SmartScreen 可能拦截，点击「详细信息 → 仍要运行」即可安装。</li>
      </ul>
    </div>
  </div>

  <script>
    const REPO = "neekin/seaply-client";
    const fmtSize = (b) => b == null ? "" : (b / 1048576).toFixed(1) + " MB";
    const ua = navigator.userAgent;
    const isMac = /Mac/i.test(ua), isWin = /Win/i.test(ua);

    function setCard(os, asset, tag) {
      const card = document.getElementById("card-" + os);
      const meta = document.getElementById("meta-" + os);
      const btn = document.getElementById("btn-" + os);
      if (asset) {
        meta.textContent = (tag || "") + "版本 " + tag + " · " + fmtSize(asset.size);
        btn.href = asset.browser_download_url;
        btn.classList.remove("disabled");
        btn.textContent = "下载 " + asset.name.replace(/^.*\./, ".");
      } else {
        meta.innerHTML = '<span class="skel">暂无可下载版本</span>';
        btn.textContent = "暂无";
      }
    }

    async function load() {
      try {
        const res = await fetch("https://api.github.com/repos/" + REPO + "/releases/latest");
        if (!res.ok) throw new Error("no release");
        const rel = await res.json();
        const assets = rel.assets || [];
        const mac = assets.find(a => /\.dmg$/i.test(a.name));
        const win = assets.find(a => /\.(exe|msi)$/i.test(a.name));
        setCard("mac", mac, rel.tag_name);
        setCard("win", win, rel.tag_name);
        // 推荐高亮
        const rec = isMac ? "mac" : isWin ? "win" : null;
        if (rec) {
          document.getElementById("card-" + rec).classList.add("recommend");
          document.getElementById("tag-" + rec).style.display = "inline-block";
        }
      } catch (e) {
        document.getElementById("meta-mac").innerHTML = '<span class="err">未能获取发布信息，请到 Releases 页下载。</span>';
        document.getElementById("meta-win").innerHTML = '<span class="err">未能获取发布信息，请到 Releases 页下载。</span>';
      }
    }
    load();
  </script>
</body>
</html>
